
<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>빌딩 위치 지도</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: 'Noto Sans KR', sans-serif;
        }
        #map {
            width: 100%;
            height: 100%;
        }
        .building-list {
            position: absolute;
            top: 10px;
            right: 10px;
            background: white;
            padding: 10px;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            max-width: 250px;
            max-height: 300px;
            overflow-y: auto;
            z-index: 2;
        }
        .building-item {
            margin: 5px 0;
            font-size: 12px;
        }
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            background: rgba(255,255,255,0.8);
            padding: 20px;
            border-radius: 10px;
            z-index: 10;
        }
        #error-msg {
            display: none;
            padding: 20px;
            background-color: #ffdddd;
            color: #ff0000;
            margin: 20px;
            border-radius: 5px;
            text-align: center;
        }
        .timestamp {
            position: absolute;
            bottom: 10px;
            left: 10px;
            background: rgba(255,255,255,0.7);
            padding: 5px 10px;
            border-radius: 3px;
            font-size: 12px;
            z-index: 2;
        }
    </style>
</head>
<body>
    <div id="loading">지도를 로딩 중입니다...</div>
    <div id="error-msg">
        카카오맵을 로드할 수 없습니다.<br>
        인터넷 연결을 확인해주세요.
    </div>
    <div id="map"></div>
    <div class="building-list">
        <h3>선택된 빌딩 (2개)</h3>
        <div class='building-item'>1. <b>시그니쳐 타워</b><br>서울특별시 중구 청계천로 100</div><div class='building-item'>2. <b>페럼타워</b><br>서울시 중구 을지로5길 19</div>
    </div>
    <div class="timestamp">생성일시: 2025-04-29 09:09:48</div>

    <!-- 빌딩 데이터 저장 -->
    <script>
        var BUILDING_DATA = [{"name": "시그니쳐 타워", "address": "서울특별시 중구 청계천로 100", "idx": 1}, {"name": "페럼타워", "address": "서울시 중구 을지로5길 19", "idx": 4}];
    </script>
    
    <!-- 카카오맵 SDK -->
    <script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=1ac6eee9b1e4c2e0cc6f1d1ca1a6a559&libraries=services" 
            onerror="handleError()" 
            onload="initMap()"></script>
    
    <!-- 지도 초기화 스크립트 -->
    <script>
        // 에러 처리 함수
        function handleError() {
            document.getElementById('loading').style.display = 'none';
            document.getElementById('error-msg').style.display = 'block';
            console.error('카카오맵 SDK를 로드할 수 없습니다.');
        }
        
        // 지도 초기화 함수
        function initMap() {
            try {
                // 로딩 중 표시 제거
                document.getElementById('loading').style.display = 'none';
                
                // 지도 컨테이너
                var mapContainer = document.getElementById('map');
                
                // 지도 옵션
                var mapOption = {
                    center: new kakao.maps.LatLng(37.566826, 126.9786567),
                    level: 5
                };
                
                // 지도 생성
                var map = new kakao.maps.Map(mapContainer, mapOption);
                
                // 주소-좌표 변환 객체
                var geocoder = new kakao.maps.services.Geocoder();
                
                // 지도 영역 객체
                var bounds = new kakao.maps.LatLngBounds();
                
                // 마커와 인포윈도우 배열
                var markers = [];
                var infowindows = [];
                
                // 빌딩 데이터 순회
                BUILDING_DATA.forEach(function(building, index) {
                    // 주소로 좌표 검색
                    geocoder.addressSearch(building.address, function(result, status) {
                        if (status === kakao.maps.services.Status.OK) {
                            // 좌표 객체 생성
                            var coords = new kakao.maps.LatLng(result[0].y, result[0].x);
                            
                            // 마커 생성
                            var marker = new kakao.maps.Marker({
                                map: map,
                                position: coords
                            });
                            
                            // 인포윈도우 내용
                            var infoContent = '<div style="padding:5px;width:150px;text-align:center;font-size:12px;">' + 
                                              building.name + '</div>';
                            
                            // 인포윈도우 생성
                            var infowindow = new kakao.maps.InfoWindow({
                                content: infoContent
                            });
                            
                            // 인포윈도우 배열에 추가
                            infowindows.push(infowindow);
                            
                            // 마커 클릭 이벤트
                            kakao.maps.event.addListener(marker, 'click', function() {
                                // 모든 인포윈도우 닫기
                                closeAllInfowindows();
                                
                                // 현재 마커의 인포윈도우 열기
                                infowindow.open(map, marker);
                            });
                            
                            // 지도 영역에 좌표 추가
                            bounds.extend(coords);
                            
                            // 마커 배열에 추가
                            markers.push(marker);
                            
                            // 모든 마커가 추가되면 지도 영역 설정
                            if (markers.length === BUILDING_DATA.length) {
                                map.setBounds(bounds);
                            }
                        }
                    });
                });
                
                // 모든 인포윈도우 닫기 함수
                function closeAllInfowindows() {
                    infowindows.forEach(function(infowindow) {
                        infowindow.close();
                    });
                }
                
            } catch (e) {
                // 오류 발생 시 처리
                console.error('지도 초기화 오류:', e);
                handleError();
            }
        }
        
        // 페이지 로드 시 에러 체크
        window.onload = function() {
            setTimeout(function() {
                if (document.getElementById('map').innerHTML === '') {
                    handleError();
                }
            }, 5000); // 5초 후에 지도가 로드되지 않으면 에러로 간주
        };
    </script>
</body>
</html>
