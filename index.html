<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>임대정보 통합검색 시스템</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.1/font/bootstrap-icons.css">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
    
    <!-- Kakao Map -->
    <script type="text/javascript" src="//dapi.kakao.com/v2/maps/sdk.js?appkey=1ac6eee9b1e4c2e0cc6f1d1ca1a6a559&libraries=services"></script>
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">
                <i class="bi bi-building"></i> 임대정보 통합검색
            </a>
            <span class="navbar-text text-white">
                <small id="lastUpdated">Loading...</small>
            </span>
        </div>
    </nav>

    <!-- Search Section -->
    <div class="container-fluid mt-4">
        <div class="row">
            <div class="col-12">
                <div class="card shadow-sm">
                    <div class="card-body">
                        <h5 class="card-title mb-4">검색 조건</h5>
                        
                        <!-- Search Type Selection -->
                        <div class="row mb-3">
                            <div class="col-md-2">
                                <label class="form-label">검색 유형</label>
                                <select class="form-select" id="searchType">
                                    <option value="building">빌딩명</option>
                                    <option value="district">지역명</option>
                                    <option value="station">역명</option>
                                    <option value="area">임대조건</option>
                                    <option value="complex">복합검색</option>
                                </select>
                            </div>
                            
                            <!-- Building Name Search -->
                            <div class="col-md-10 search-input" id="buildingSearch">
                                <label class="form-label">빌딩명</label>
                                <input type="text" class="form-control" id="buildingName" 
                                       placeholder="빌딩명을 입력하세요" autocomplete="off">
                                <div id="buildingSuggestions" class="suggestions"></div>
                            </div>
                            
                            <!-- District Search -->
                            <div class="col-md-10 search-input d-none" id="districtSearch">
                                <label class="form-label">지역명</label>
                                <div class="row">
                                    <div class="col-md-6">
                                        <input type="text" class="form-control" id="districtName" 
                                               placeholder="구, 동, 또는 주소 일부" autocomplete="off">
                                        <div id="districtSuggestions" class="suggestions"></div>
                                    </div>
                                </div>
                            </div>
                            
                            <!-- Station Search -->
                            <div class="col-md-10 search-input d-none" id="stationSearch">
                                <label class="form-label">역명</label>
                                <div class="row">
                                    <div class="col-md-6">
                                        <input type="text" class="form-control" id="stationName" 
                                               placeholder="역 이름" autocomplete="off">
                                        <div id="stationSuggestions" class="suggestions"></div>
                                    </div>
                                    <div class="col-md-3">
                                        <input type="number" class="form-control" id="walkingTime" 
                                               placeholder="도보시간(분)" min="1" max="30">
                                    </div>
                                </div>
                            </div>
                            
                            <!-- Area Search -->
                            <div class="col-md-10 search-input d-none" id="areaSearch">
                                <label class="form-label">임대조건</label>
                                <div class="row">
                                    <div class="col-md-6">
                                        <label class="form-label">공실 전용면적 (평)</label>
                                        <div class="input-group">
                                            <input type="number" class="form-control" id="vacancyAreaFrom" placeholder="최소">
                                            <span class="input-group-text">~</span>
                                            <input type="number" class="form-control" id="vacancyAreaTo" placeholder="최대">
                                        </div>
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label">기준층 전용면적 (평)</label>
                                        <div class="input-group">
                                            <input type="number" class="form-control" id="buildingAreaFrom" placeholder="최소">
                                            <span class="input-group-text">~</span>
                                            <input type="number" class="form-control" id="buildingAreaTo" placeholder="최대">
                                        </div>
                                    </div>
                                </div>
                            </div>
                            
                            <!-- Complex Search -->
                            <div class="col-md-10 search-input d-none" id="complexSearch">
                                <div class="alert alert-info">
                                    <i class="bi bi-info-circle"></i> 복합검색에서는 모든 검색 조건을 함께 사용할 수 있습니다.
                                </div>
                            </div>
                        </div>
                        
                        <!-- Search Button -->
                        <div class="row">
                            <div class="col-12">
                                <button class="btn btn-primary" id="searchBtn">
                                    <i class="bi bi-search"></i> 검색
                                </button>
                                <button class="btn btn-secondary" id="resetBtn">
                                    <i class="bi bi-arrow-clockwise"></i> 초기화
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Selected Buildings -->
        <div class="row mt-3 d-none" id="selectedBuildingsSection">
            <div class="col-12">
                <div class="card shadow-sm">
                    <div class="card-body">
                        <h6 class="card-title">
                            선택된 빌딩 <span class="badge bg-primary" id="selectedCount">0</span>
                        </h6>
                        <div id="selectedBuildingsList" class="mb-2"></div>
                        <button class="btn btn-success btn-sm" id="showSelectedMap">
                            <i class="bi bi-map"></i> 선택빌딩 지도보기
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Results Section -->
        <div class="row mt-4">
            <div class="col-12">
                <div class="card shadow-sm">
                    <div class="card-body">
                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <h5 class="card-title mb-0">
                                검색 결과 <span class="badge bg-secondary" id="resultCount">0</span>
                            </h5>
                            <div class="d-flex align-items-center">
                                <label class="me-2">표시 개수:</label>
                                <select class="form-select form-select-sm" id="pageSize" style="width: auto;">
                                    <option value="20">20개</option>
                                    <option value="50">50개</option>
                                    <option value="100">100개</option>
                                </select>
                            </div>
                        </div>
                        
                        <!-- Results Table -->
                        <div class="table-responsive">
                            <table class="table table-hover" id="resultsTable">
                                <thead>
                                    <tr>
                                        <th>선택</th>
                                        <th>빌딩명</th>
                                        <th>주소</th>
                                        <th>인근역</th>
                                        <th>공실층</th>
                                        <th>공실전용면적(평)</th>
                                        <th>기준층전용면적(평)</th>
                                        <th>출처</th>
                                        <th>액션</th>
                                    </tr>
                                </thead>
                                <tbody id="resultsBody">
                                    <tr>
                                        <td colspan="9" class="text-center text-muted">
                                            검색 조건을 입력하고 검색 버튼을 클릭하세요.
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                        
                        <!-- Pagination -->
                        <nav>
                            <ul class="pagination justify-content-center" id="pagination">
                            </ul>
                        </nav>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Loading Spinner -->
    <div class="loading-overlay d-none" id="loadingOverlay">
        <div class="spinner-border text-primary" role="status">
            <span class="visually-hidden">Loading...</span>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/data.js"></script>
    <script src="js/search.js"></script>
    <script src="js/map.js"></script>
</body>
</html>
